<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Call-Up · Wesley Zheng</title>
  <meta name="description" content="Wesley Zheng's national-team squads for the top 100 FIFA Men's World Ranking nations, refreshed daily.">
  <link rel="icon" href="https://wkaiz.github.io/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#08090b; --panel:#0e1013; --panel-2:#13161a; --line:#1f242b; --line-2:#2a313a;
            --ink:#e6e9ee; --muted:#7d8794; --dim:#545d68; --accent:#38bdf8;
            --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
            --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--sans); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
           background-color:var(--bg);
           background-image:linear-gradient(var(--line) 1px, transparent 1px),
                            linear-gradient(90deg, var(--line) 1px, transparent 1px);
           background-size:48px 48px; background-position:-1px -1px; background-attachment:fixed; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
                   background:radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 75%); }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; text-underline-offset:3px; }
    ::selection { background:rgba(56,189,248,.3); }

    .site-header { position:sticky; top:0; z-index:50; background:rgba(8,9,11,.82);
                   backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .site-header .inner { max-width:1320px; margin:0 auto; padding:0 1.5rem; display:flex; align-items:stretch;
                          justify-content:space-between; gap:1rem; flex-wrap:wrap; min-height:52px; }
    .site-title { display:flex; align-items:center; gap:.6rem; font-family:var(--mono); font-weight:600;
                  font-size:.9rem; color:var(--ink); letter-spacing:.02em; }
    .site-title:hover { text-decoration:none; }
    .site-title .dot { width:8px; height:8px; background:var(--accent); box-shadow:0 0 10px var(--accent); }
    .site-nav { display:flex; flex-wrap:wrap; align-items:stretch; }
    .site-nav a { display:flex; align-items:center; font-family:var(--mono); font-size:.76rem; font-weight:500;
                  letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:0 .9rem;
                  border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s, border-color .15s; }
    .site-nav a:hover { color:var(--ink); text-decoration:none; }
    .site-nav a.active { color:var(--ink); border-bottom-color:var(--accent); }
    .site-nav .sep { width:1px; background:var(--line); margin:.9rem .4rem; }

    .hero { border-bottom:1px solid var(--line); }
    .hero .inner { max-width:1320px; margin:0 auto; padding:1.75rem 1.5rem 1.5rem; display:grid;
                   grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:2rem; align-items:end; }
    .eyebrow { font-family:var(--mono); font-size:.72rem; color:var(--accent); letter-spacing:.08em; }
    .eyebrow::before { content:"> "; color:var(--dim); }
    h1 { font-size:clamp(1.8rem, 3.6vw, 2.5rem); line-height:1.1; letter-spacing:-.02em; margin:.5rem 0 .6rem; font-weight:700; }
    .intro { color:var(--muted); margin:0; max-width:46rem; font-size:1rem; }
    .intro a { color:var(--ink); border-bottom:1px solid var(--accent); }
    .intro a:hover { text-decoration:none; color:var(--accent); }
    .hero-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; margin-top:0;
                  border:1px solid var(--line); background:var(--line); max-width:860px; }
    .stat { padding:.8rem 1rem; background:var(--panel); min-width:0; }
    .stat span { display:block; font-family:var(--mono); font-size:.66rem; color:var(--dim);
                 text-transform:uppercase; letter-spacing:.1em; }
    .stat b { display:block; font-family:var(--mono); font-size:1rem; font-weight:500; margin-top:.15rem;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stat b small { display:block; font-size:.7rem; font-weight:400; color:var(--muted); margin-top:.1rem; }

    main { max-width:1320px; margin:0 auto; padding:1.25rem 1.5rem 1rem; }
    .view-head { margin-bottom:1.1rem; }
    .view-title { font-size:1.3rem; font-weight:600; margin:0; letter-spacing:-.01em; }
    .view-desc { color:var(--muted); font-size:.88rem; margin:.15rem 0 0; }

    .ef-wrap { --ef-muted:var(--muted); --ef-accent:var(--accent); color:var(--ink); }


    .nation-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
                   padding-bottom:.9rem; border-bottom:1px solid var(--line); }
    .nation-name { display:flex; align-items:center; gap:.7rem; font-size:1.5rem; font-weight:700; letter-spacing:-.01em; }
    .nation-name .flag { font-size:1.7rem; line-height:1; }
    .tier { font-family:var(--mono); font-size:.66rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
            padding:.18rem .45rem; border:1px solid currentColor; border-radius:3px; color:#4ade80; }
    .tier[data-tier="challenger"] { color:var(--accent); }
    .tier[data-tier="backup"] { color:var(--muted); }
    .ef-squad-switch { display:inline-flex; border:1px solid var(--line-2); border-radius:4px; overflow:hidden; }
    .ef-squad-choice { cursor:pointer; border:0; background:transparent; color:var(--muted); padding:.4rem .85rem;
                       font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
                       transition:all .12s; }
    .ef-squad-choice + .ef-squad-choice { border-left:1px solid var(--line-2); }
    .ef-squad-choice:hover { color:var(--ink); }
    .ef-squad-choice.active { background:var(--ink); color:var(--bg); }

    .ef-section-title { font-family:var(--mono); font-size:.72rem; font-weight:500; letter-spacing:.1em;
                        text-transform:uppercase; color:var(--muted); margin:1.6rem 0 .8rem;
                        display:flex; align-items:center; gap:.6rem; }
    .ef-section-title::before { content:"//"; color:var(--dim); }
    .ef-section-title .count { color:var(--accent); letter-spacing:0; }
    .ef-section-title .count::before { content:"["; color:var(--dim); }
    .ef-section-title .count::after { content:"]"; color:var(--dim); }
    .ef-section-title::after { content:""; flex:1; height:1px; background:var(--line); }
    .ef-grid { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    .ef-card { --ct:var(--line-2); position:relative; background:var(--panel); border:1px solid var(--line);
               border-top:2px solid var(--ct); border-radius:4px; padding:.5rem .5rem .65rem; text-align:left;
               transition:border-color .15s, background .15s, transform .15s; }
    .ef-card:hover { background:var(--panel-2); border-color:var(--line-2); border-top-color:var(--ct); transform:translateY(-2px); }
    a.ef-card { display:block; color:inherit; text-decoration:none; }
    a.ef-card:hover .ef-name { color:var(--accent); }
    .ef-photo { position:relative; width:100%; aspect-ratio:4/5; margin-bottom:.55rem; border-radius:2px;
                background:#15191e; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .ef-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; }
    .ef-photo .ef-initials { font-family:var(--mono); font-size:1.5rem; font-weight:500; color:var(--dim); }
    .ef-num { position:absolute; top:.35rem; left:.35rem; z-index:2; font-family:var(--mono); font-size:.68rem; font-weight:500;
              color:var(--ink); background:rgba(8,9,11,.78); border:1px solid var(--line-2); border-radius:2px; padding:0 .3rem; }
    .ef-rating { position:absolute; top:.35rem; right:.35rem; z-index:2; font-family:var(--mono); font-size:.78rem; font-weight:600;
                 color:var(--bg); background:var(--ct); border-radius:2px; padding:0 .32rem; }
    .ef-name { font-weight:600; font-size:.88rem; line-height:1.25; min-height:2.5em; display:flex; align-items:center;
               transition:color .12s; }
    .ef-meta-row { display:flex; align-items:center; justify-content:space-between; gap:.4rem; margin-top:.35rem; }
    .ef-pos { font-family:var(--mono); font-size:.66rem; font-weight:500; letter-spacing:.04em; padding:0 .3rem;
              border:1px solid currentColor; border-radius:2px; color:var(--muted); }
    .ef-pos[data-line="GK"]  { color:#fbbf24; }
    .ef-pos[data-line="DEF"] { color:#60a5fa; }
    .ef-pos[data-line="MID"] { color:#4ade80; }
    .ef-pos[data-line="FWD"] { color:#f87171; }
    .ef-country { margin-top:.3rem; font-size:.74rem; color:var(--muted); }
    .ef-days { font-family:var(--mono); font-size:.66rem; color:var(--dim); }
    .ef-days .ef-medal { font-size:.8rem; margin-right:.2rem; }
    .ef-card.ef-ranked .ef-days { color:#fbbf24; }

    .ef-card.ef-ct-standard  { --ct:#6b7280; }
    .ef-card.ef-ct-highlight { --ct:#e5e7eb; }
    .ef-card.ef-ct-showtime  { --ct:#f472b6; }
    .ef-card.ef-ct-epic      { --ct:#f59e0b; }
    .ef-card.ef-ct-bigtime   { --ct:#22d3ee; }

    .ef-loading, .ef-error { font-family:var(--mono); font-size:.82rem; color:var(--muted); padding:2rem 1rem;
                             text-align:center; border:1px dashed var(--line-2); background:var(--panel); margin-top:1rem; }
    footer { font-family:var(--mono); text-align:center; color:var(--dim); font-size:.72rem; padding:2.5rem 1rem;
             letter-spacing:.06em; }


    .ov-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem; align-items:start; margin-bottom:1rem; }
    .overview-activity { align-items:stretch; }
    .overview-activity > .panel, .overview-activity .tab-view:not([hidden]),
    .overview-activity .xlist, .overview-activity #movers { display:flex; flex-direction:column; }
    .overview-activity .tab-view:not([hidden]), .overview-activity .xlist,
    .overview-activity #movers, .overview-activity .feed-row,
    .overview-activity .mover-row { flex:1; }
    .overview-activity .xlist-toggle { margin-top:auto; }
    .overview-activity .panel.locked .xlist { display:block; }
    .panel { background:var(--panel); border:1px solid var(--line); min-width:0; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.7rem 1rem;
                  border-bottom:1px solid var(--line); font-family:var(--mono); font-size:.7rem; letter-spacing:.1em;
                  text-transform:uppercase; color:var(--muted); }
    .panel-head::before { content:"//"; color:var(--dim); margin-right:-.2rem; }
    .panel-head .title { flex:1; }
    .panel-head .aside { color:var(--dim); letter-spacing:.04em; text-transform:none; }
    .panel-head .aside a { color:var(--ink); }

    .panel.locked { display:flex; flex-direction:column; }
    .panel.locked .xlist { flex:1; min-height:0; overflow-y:auto; }
    .pitch-scroll { min-width:0; overflow-x:auto; }
    .pitch { position:relative; min-height:540px; margin:1rem; border:1px solid var(--line-2);
             background:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 10%, transparent 10% 20%), #0b0d10; }
    .pitch .pm { position:absolute; border:1px solid var(--line-2); pointer-events:none; }
    .pitch .pm.half { top:0; bottom:0; left:50%; width:0; border-width:0 0 0 1px; }
    .pitch .pm.circle { left:50%; top:50%; width:22%; aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%); }
    .pitch .pm.box-left { top:25%; bottom:25%; left:0; width:15%; border-left:0; }
    .pitch .pm.box-right { top:25%; bottom:25%; right:0; width:15%; border-right:0; }
    .xi-node { position:absolute; width:92px; transform:translate(-50%,-50%); text-align:center; color:inherit; z-index:1; }
    a.xi-node:hover { text-decoration:none; }
    a.xi-node:hover .xi-name { color:var(--accent); }
    .xi-photo { --ct:var(--line-2); position:relative; width:52px; height:52px; margin:0 auto .3rem; border:2px solid var(--ct);
                border-radius:3px; background:#15191e; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .xi-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; }
    .xi-photo .ef-initials { font-family:var(--mono); font-size:.9rem; color:var(--dim); }
    .xi-photo.ef-ct-standard { --ct:#6b7280; } .xi-photo.ef-ct-highlight { --ct:#e5e7eb; }
    .xi-photo.ef-ct-showtime { --ct:#f472b6; } .xi-photo.ef-ct-epic { --ct:#f59e0b; } .xi-photo.ef-ct-bigtime { --ct:#22d3ee; }
    .xi-name { font-size:.74rem; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
               transition:color .12s; }
    .xi-meta { font-family:var(--mono); font-size:.62rem; color:var(--muted); white-space:nowrap; }
    .xi-meta b { color:var(--ink); font-weight:600; }

    .feed-row, .rank-row { display:grid; align-items:center; gap:.7rem; padding:.42rem 1rem; border-bottom:1px solid var(--line);
                           font-size:.85rem; color:inherit; }
    .feed-row:last-child, .rank-row:last-child { border-bottom:0; }
    a.feed-row:hover, a.rank-row:hover { background:var(--panel-2); text-decoration:none; }
    .feed-row { grid-template-columns:3.4rem minmax(0,1fr) auto 2.2rem; }
    .feed-date { font-family:var(--mono); font-size:.72rem; color:var(--dim); }
    .feed-who { min-width:0; }
    .feed-who b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .feed-who span { display:block; font-size:.74rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .num { font-family:var(--mono); font-size:.82rem; text-align:right; }
    .feed-more { padding:.6rem 1rem; font-family:var(--mono); font-size:.7rem; color:var(--dim); border-top:1px solid var(--line); }

    .rank-row { grid-template-columns:2rem minmax(0,13rem) minmax(0,1fr) 3.4rem; }
    .rank-n { font-family:var(--mono); font-size:.74rem; color:var(--dim); }
    .rank-nation { display:flex; align-items:center; gap:.5rem; min-width:0; font-weight:500; }
    .rank-nation .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rank-nation .tier { font-size:.58rem; padding:0 .3rem; }
    .bar { height:6px; background:#1a1f25; position:relative; }
    .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); opacity:.85; }
    .rank-row[data-tier="contender"] .bar i { background:#4ade80; }
    .rank-row[data-tier="backup"] .bar i { background:var(--muted); }
    .rank-toggle { display:block; width:100%; padding:.65rem 1rem; border:0; border-top:1px solid var(--line); background:transparent;
                   color:var(--accent); font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
                   cursor:pointer; text-align:left; }
    .rank-toggle:hover { background:var(--panel-2); }

    .layout.with-sidebar { display:grid; grid-template-columns:260px minmax(0,1fr); gap:1.5rem; align-items:start; }
    .content { min-width:0; }
    .sidebar[hidden] { display:none; }
    .sidebar { position:sticky; top:68px; display:flex; flex-direction:column; max-height:calc(100vh - 84px);
               background:var(--panel); border:1px solid var(--line); }
    .sidebar .nation-search { margin:.7rem; }
    .nation-list { overflow-y:auto; flex:1; padding-bottom:.4rem; scrollbar-width:thin; scrollbar-color:var(--line-2) transparent; }
    .nation-group-label { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between;
                          padding:.45rem .9rem; background:var(--panel); border-bottom:1px solid var(--line);
                          font-family:var(--mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
    .nation-group-label::before { content:"// "; white-space:pre; }
    .nation-group-label span { margin-right:auto; }
    .nation-row { display:grid; grid-template-columns:1.4rem minmax(0,1fr) auto; align-items:center; gap:.5rem;
                  padding:.36rem .9rem .36rem calc(.9rem - 2px); border-left:2px solid transparent;
                  font-size:.85rem; color:#b5bdc8; }
    .nation-row:hover { background:var(--panel-2); color:var(--ink); text-decoration:none; }
    .nation-row.active { border-left-color:var(--accent); background:rgba(56,189,248,.08); color:var(--ink); }
    .nation-row .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nation-row .score { font-family:var(--mono); font-size:.7rem; color:var(--dim); }
    .nation-row.active .score { color:var(--accent); }
    .nation-row[hidden], .nation-group[hidden] { display:none; }
    .nation-search { display:flex; align-items:center; gap:.6rem; border:1px solid var(--line-2); background:var(--bg);
                     padding:0 .7rem; }
    .nation-search span { font-family:var(--mono); color:var(--accent); font-size:.85rem; }
    .nation-search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink);
                           font-family:var(--mono); font-size:.85rem; padding:.6rem 0; }
    .nation-search input::placeholder { color:var(--dim); }
    .nation-search:focus-within { border-color:var(--accent); }
    .no-match { font-family:var(--mono); font-size:.75rem; color:var(--dim); padding:.6rem .9rem; }
    .nation-head { margin-top:0; }

    @media (max-width:900px) {
      .ov-grid { grid-template-columns:minmax(0,1fr); }
      .layout.with-sidebar { grid-template-columns:minmax(0,1fr); gap:1rem; }
      .sidebar { position:static; max-height:320px; }
    }
    @media (max-width:700px) { .pitch { min-width:640px; } }
    @media (max-width:520px) { .xi-node { width:70px; } .xi-photo { width:40px; height:40px; }
                               .rank-row { grid-template-columns:1.6rem minmax(0,1fr) 3rem; } .rank-row .bar { display:none; } }

    .psearch { position:relative; flex:1; max-width:360px; display:flex; align-items:center; gap:.5rem; align-self:center;
               border:1px solid var(--line-2); background:var(--bg); padding:0 .6rem; margin:0 1.25rem; }
    .psearch:focus-within { border-color:var(--accent); }
    .psearch .ps-icon { font-family:var(--mono); color:var(--accent); font-size:.8rem; }
    .psearch input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink);
                     font-family:var(--mono); font-size:.8rem; padding:.45rem 0; }
    .psearch input::placeholder { color:var(--dim); }
    .psearch input::-webkit-search-cancel-button { display:none; }
    .psearch kbd { font-family:var(--mono); font-size:.65rem; color:var(--dim); border:1px solid var(--line-2);
                   border-radius:3px; padding:0 .3rem; }
    .ps-results { position:absolute; left:-1px; right:-1px; top:calc(100% + 4px); z-index:60; background:var(--panel);
                  border:1px solid var(--line-2); box-shadow:0 18px 40px rgba(0,0,0,.55); max-height:70vh; overflow-y:auto; }
    .ps-results[hidden] { display:none; }
    .ps-item { display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:.6rem; align-items:center;
               padding:.45rem .7rem; color:inherit; border-bottom:1px solid var(--line); }
    .ps-item:last-child { border-bottom:0; }
    .ps-item:hover, .ps-item.sel { background:var(--panel-2); text-decoration:none; }
    .ps-item.sel { box-shadow:inset 2px 0 0 var(--accent); }
    .ps-thumb { width:32px; height:32px; background:#15191e; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .ps-thumb img { width:100%; height:100%; object-fit:cover; object-position:top center; }
    .ps-thumb .ef-initials { font-family:var(--mono); font-size:.65rem; color:var(--dim); }
    .ps-name { font-size:.85rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ps-name mark { background:none; color:var(--accent); font-weight:700; }
    .ps-meta { font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ps-filters { display:flex; flex-wrap:wrap; gap:.35rem; padding:.5rem .7rem; border-bottom:1px solid var(--line); }
    .ps-empty { padding:.8rem; font-family:var(--mono); font-size:.75rem; color:var(--dim); }

    .pl-back { display:inline-block; font-family:var(--mono); font-size:.75rem; color:var(--muted); margin-bottom:1rem; }
    .pl-head { --ct:var(--line-2); display:grid; grid-template-columns:200px minmax(0,1fr); gap:1.5rem;
               background:var(--panel); border:1px solid var(--line); border-top:2px solid var(--ct); padding:1.25rem; }
    .pl-head.ef-ct-standard { --ct:#6b7280; } .pl-head.ef-ct-highlight { --ct:#e5e7eb; }
    .pl-head.ef-ct-showtime { --ct:#f472b6; } .pl-head.ef-ct-epic { --ct:#f59e0b; } .pl-head.ef-ct-bigtime { --ct:#22d3ee; }
    .pl-photo { aspect-ratio:4/5; background:#15191e; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .pl-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; }
    .pl-photo .ef-initials { font-family:var(--mono); font-size:2.4rem; color:var(--dim); }
    .pl-top { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; }
    .pl-name { font-size:clamp(1.6rem,3.5vw,2.3rem); font-weight:700; letter-spacing:-.02em; line-height:1.1; margin:0; }
    .pl-sub { margin-top:.4rem; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
    .pl-sub a { color:var(--ink); }
    .pl-rating { font-family:var(--mono); text-align:right; }
    .pl-rating b { display:block; font-size:3rem; line-height:1; font-weight:600; color:var(--ct); }
    .pl-rating span { font-size:.66rem; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; }
    .pl-badges { display:flex; flex-wrap:wrap; gap:.4rem; margin:.9rem 0 1.1rem; }
    .chip { font-family:var(--mono); font-size:.68rem; letter-spacing:.04em; padding:.1rem .45rem;
            border:1px solid var(--line-2); border-radius:2px; color:var(--muted); }
    .chip.ct { border-color:var(--ct); color:var(--ct); }
    .pl-stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1px; background:var(--line);
                border:1px solid var(--line); }
    .pl-links { margin-top:1rem; display:flex; gap:1rem; font-family:var(--mono); font-size:.78rem; }
    .pl-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem; margin-top:1rem; }
    .ov-grid.ov-even { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .chip.warn { border-color:#f87171; color:#f87171; }
    .pl-history { margin-top:1rem; scroll-margin-top:70px; }
    .card-tabs { display:flex; flex-wrap:wrap; gap:1px; background:var(--line); border-bottom:1px solid var(--line); }
    .card-tab { font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; padding:.5rem .9rem; border:0; cursor:pointer;
                background:var(--panel); color:var(--muted); }
    .card-tab:hover { color:var(--ink); }
    .card-tab.active { background:var(--panel-2); color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
    button.card-pick { width:100%; background:none; border:0; border-bottom:1px solid var(--line); color:inherit; font:inherit;
                       font-size:.85rem; text-align:left; cursor:pointer; align-items:center; }
    button.card-pick:last-child { border-bottom:0; }
    button.card-pick:hover, button.card-pick.active { background:var(--panel-2); }
    button.card-pick.active { box-shadow:inset 2px 0 0 var(--accent); }
    .card-rank { font-family:var(--mono); font-size:.72rem; color:var(--muted); min-width:3.2rem; text-align:right; }
    .tab-rank { color:var(--muted); margin-left:.35rem; }
    .card-tab.active .tab-rank { color:inherit; }
    .chip.in { border-color:#4ade80; color:#4ade80; }
    .card-side { display:flex; align-items:center; gap:.4rem; }
    .card-rating { min-width:3.6rem; text-align:right; }
    .seg { display:flex; gap:1px; background:var(--line); border-bottom:1px solid var(--line); }
    .seg button { flex:1; font-family:var(--mono); font-size:.7rem; letter-spacing:.06em; padding:.45rem; border:0; cursor:pointer;
                  background:var(--panel); color:var(--muted); }
    .seg button.active { background:var(--panel-2); color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
    .tab-view[hidden] { display:none; }
    .record-grid { padding:1rem; }
    .jersey-table-wrap { max-height:460px; overflow:auto; }
    .jersey-table { width:100%; border-collapse:collapse; font-size:.84rem; }
    .jersey-table th { position:sticky; top:0; z-index:1; background:var(--panel-2); color:var(--dim);
                       font-family:var(--mono); font-size:.65rem; font-weight:500; letter-spacing:.08em;
                       text-transform:uppercase; text-align:left; }
    .jersey-table th, .jersey-table td { padding:.5rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap; }
    .jersey-table tbody tr:hover { background:var(--panel-2); }
    .jersey-table .number, .jersey-table .metric { font-family:var(--mono); }
    .jersey-table .number { color:var(--accent); font-weight:600; }
    .jersey-table .metric { text-align:right; }
    .jersey-table th.metric { text-align:right; }
    .jersey-table .nation { color:var(--muted); }
    .jersey-table a { color:var(--ink); font-weight:600; }
    .jersey-table a:hover { color:var(--accent); }
    .mover-label { font-family:var(--mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
                   padding:.45rem 1rem .25rem; border-bottom:1px solid var(--line); }
    .mover-row { display:grid; grid-template-columns:minmax(0,1fr) 84px 6.2rem 3rem; gap:.7rem; align-items:center;
                 padding:.42rem 1rem; border-bottom:1px solid var(--line); color:inherit; }
    .mover-row:hover { background:var(--panel-2); text-decoration:none; }
    .mover-ranks { font-family:var(--mono); font-size:.74rem; color:var(--muted); text-align:right; }
    .mover-delta { font-family:var(--mono); font-size:.78rem; text-align:right; }
    .mover-delta.up { color:#4ade80; } .mover-delta.down { color:#f87171; }
    .spark { width:84px; height:24px; overflow:visible; }
    .spark path { fill:none; stroke:var(--accent); stroke-width:1.5; vector-effect:non-scaling-stroke; }
    .strength { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); align-items:start; }
    .strength-list { border-right:1px solid var(--line); min-width:0; max-height:330px; overflow-y:auto; }
    .strength-chart { min-width:0; position:sticky; top:64px; align-self:start; }
    .strength-chart-head { display:flex; align-items:center; gap:.5rem; padding:.75rem 1rem 0; font-size:.9rem; }
    .strength-chart-head a { margin-left:auto; font-family:var(--mono); font-size:.72rem; }
    .strength-chart .rank-chart { border-bottom:0; }
    .rank-chart { padding:.75rem 1rem .5rem; border-bottom:1px solid var(--line); }
    .rank-chart-head { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin-bottom:.5rem; }
    .rank-chart-head > span:first-child { font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
                                          color:var(--dim); margin-right:.3rem; }
    .rank-chart svg { display:block; width:100%; height:auto; overflow:visible; }
    .rank-chart svg text { font-family:var(--mono); font-size:10px; fill:var(--dim); }
    .rank-chart .rk-grid { stroke:var(--line-2); stroke-dasharray:2 4; }
    .rank-chart line.rk-on { stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; }
    .rank-chart line.rk-off { stroke:var(--muted); stroke-width:1.5; stroke-dasharray:4 3; vector-effect:non-scaling-stroke; }
    .rank-chart line.rk-step { opacity:.6; }
    .rank-chart circle.rk-on { fill:var(--accent); } .rank-chart circle.rk-off { fill:var(--muted); }
    .rank-chart svg { cursor:crosshair; touch-action:pan-y; }
    .rank-chart .rk-guide { stroke:var(--ink); stroke-opacity:.35; stroke-dasharray:3 3; vector-effect:non-scaling-stroke; }
    .rank-chart .rk-marker { stroke:var(--bg); stroke-width:2; }
    .rank-readout { font-family:var(--mono); font-size:.74rem; color:var(--muted); margin-top:.35rem; min-height:1.2em; }
    .rank-readout b { color:var(--ink); font-weight:500; margin-right:.4rem; }
    .rank-legend { display:flex; align-items:center; gap:.4rem; margin-top:.35rem; font-family:var(--mono); font-size:.66rem; color:var(--dim); }
    .rank-legend span { display:inline-block; width:16px; height:0; border-top:2px solid var(--accent); }
    .rank-legend span.off { border-top:2px dashed var(--muted); margin-left:.8rem; }
    .hist-facts { display:flex; flex-wrap:wrap; gap:.4rem; padding:.75rem 1rem; border-bottom:1px solid var(--line); }
    .hist-row { display:grid; grid-template-columns:6.2rem minmax(0,1fr); gap:.8rem; align-items:baseline;
                padding:.55rem 1rem; border-bottom:1px solid var(--line); }
    .hist-row:last-child { border-bottom:0; }
    .hist-changes { display:flex; flex-wrap:wrap; gap:.35rem; }
    .hc { font-family:var(--mono); font-size:.72rem; padding:.1rem .45rem; border:1px solid var(--line-2); border-radius:2px; color:var(--ink); }
    .hc.in { border-color:#4ade80; color:#4ade80; } .hc.out { border-color:#f87171; color:#f87171; }
    .hc.up { color:#4ade80; } .hc.down { color:#f87171; } .hc.card { border-color:var(--accent); color:var(--accent); }
    .pl-stack { display:flex; flex-direction:column; gap:1rem; min-width:0; }
    .rank-row.me { background:rgba(56,189,248,.08); box-shadow:inset 2px 0 0 var(--accent); }
    .rank-row.me .num { color:var(--accent); }
    .appear { padding:.6rem 1rem; border-bottom:1px solid var(--line); font-size:.85rem; display:flex; justify-content:space-between; gap:1rem; }
    .appear:last-child { border-bottom:0; }
    .appear span { color:var(--muted); font-family:var(--mono); font-size:.75rem; }
    @media (max-width:900px) {
      .psearch { order:3; flex-basis:100%; max-width:none; margin:0 0 .6rem; }
      .pl-grid { grid-template-columns:minmax(0,1fr); }

    }
    @media (max-width:600px) { .pl-head { grid-template-columns:110px minmax(0,1fr); gap:1rem; padding:1rem; }
                               .pl-rating b { font-size:2.2rem; } }
    @media (max-width:900px) { .hero .inner { grid-template-columns:minmax(0,1fr); gap:1.2rem; }
                               .strength { grid-template-columns:minmax(0,1fr); }
                               .strength-list { border-right:0; border-bottom:1px solid var(--line); }
                               .strength-chart { position:static; } }
    @media (max-width:640px) {
      .site-header .inner { padding:0 1rem; }
      .site-nav a { padding:.6rem .55rem; }
      .hero .inner { padding:1.5rem 1rem 1.2rem; }
      main { padding:1.5rem 1rem; }
      .ef-grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="site-title" href="./"><span class="dot"></span>THE CALL-UP</a>
      <div class="psearch" id="psearch" role="combobox" aria-expanded="false" aria-haspopup="listbox">
        <span class="ps-icon">&gt;</span>
        <input id="player-search" type="search" placeholder="search players, nations, positions…" autocomplete="off" spellcheck="false"
               aria-label="Search players" aria-controls="ps-results">
        <kbd>/</kbd>
        <div class="ps-results" id="ps-results" role="listbox" hidden></div>
      </div>
      <nav class="site-nav" id="site-nav">
        <a href="#/" data-view="overview">Overview</a>
        <a href="#/nations" data-view="nations">Nations</a>
        <a href="#/records" data-view="records">Records</a>
        <span class="sep" aria-hidden="true"></span>
        <a href="https://github.com/WKaiZ/efootball" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="inner">
      <div>
      <div class="eyebrow">national-team squads, rebuilt daily</div>
      <h1>The Call-Up</h1>
      <p class="intro">
        My national-team squads for top 100 FIFA Men’s World Ranking nations.
        Squads are generated by my
        <a href="https://github.com/WKaiZ/efootball" target="_blank" rel="noopener">eFootball</a>
        project and this page refreshes automatically every day.
      </p>
      </div>
      <div class="hero-stats" id="ef-meta"></div>
    </div>
  </section>

  <main>
    <div class="ef-wrap">
      <div class="view-head">
        <h2 class="view-title" id="view-title"></h2>
        <p class="view-desc" id="view-desc"></p>
      </div>
      <div class="layout" id="layout">
        <aside class="sidebar" id="ef-tabs" hidden>
          <label class="nation-search"><span>&gt;</span>
            <input id="nation-filter" type="search" placeholder="search nations…" autocomplete="off" spellcheck="false">
          </label>
          <nav class="nation-list" id="nation-list" aria-label="Nations"></nav>
        </aside>
        <div class="content" id="ef-squad"><div class="ef-loading">loading squads…</div></div>
      </div>
    </div>
  </main>

  <footer>© WESLEY ZHENG</footer>

<script>
(function () {
  const DATA_URL = "squads.json", POOL_URL = "players.json", HISTORY_URL = "history.json";
  const GROUPS = [["contender", "Contenders"], ["challenger", "Challengers"], ["backup", "Backup"]];
  const LINE = { GK:["GK"], DEF:["CB","LB","RB","LWB","RWB"],
                 MID:["DMF","CMF","AMF","LMF","RMF"], FWD:["CF","SS","LWF","RWF"] };
  const lineOf = (p) => Object.keys(LINE).find(k => LINE[k].includes(p)) || "MID";
  const MEDAL = { 1:"🥇", 2:"🥈", 3:"🥉" };
  const ctClass = (t) => "ef-ct-" + String(t || "Standard").toLowerCase();

  const esc = (s) => String(s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const fold = (str) => [...String(str)].map(ch =>
    (ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "") || ch)[0].toLowerCase());
  const slug = (str) => fold(str).join("").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const playerKey = (c, p) => `${c.id}/${slug(p.name)}`;
  const playerHref = (c, p) => `#/player/${playerKey(c, p)}${p.pos ? "/" + p.pos : ""}`;
  const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const joinedOf = (p) => p.joined || p.since;
  const daysSince = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso+"T00:00:00Z"))/86400000));
  const photoHTML = (p) => p.img
    ? `<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}"
         onerror="this.outerHTML='<span class=&quot;ef-initials&quot;>${esc(initials(p.name))}</span>'">`
    : `<span class="ef-initials">${esc(initials(p.name))}</span>`;

  function card(p, c, showCountry) {
    const medal = p.tenureRank ? `<span class="ef-medal">${MEDAL[p.tenureRank]}</span>` : "";
    const tip = `${p.name} · ${p.pos} · ${p.card_type || "Standard"} · rating ${p.rating.toFixed(0)}${p.since ? ` · in squad since ${p.since}` : p.note ? ` · ${p.note}` : ""}`;
    const cls = `ef-card ${ctClass(p.card_type)}${p.tenureRank ? " ef-ranked" : ""}`;
    const inner = `
      <div class="ef-photo">
        ${photoHTML(p)}
        ${p.number != null ? `<span class="ef-num">#${p.number}</span>` : ""}
        <span class="ef-rating">${p.rating.toFixed(0)}</span>
      </div>
      <div class="ef-name">${esc(p.name)}</div>
      ${showCountry ? `<div class="ef-country">${c.flag||""} ${esc(c.name)}</div>` : ""}
      <div class="ef-meta-row">
        <span class="ef-pos" data-line="${lineOf(p.pos)}">${esc(p.pos)}</span>
        <span class="ef-days">${p.since ? `${medal}${daysSince(p.since)}d` : esc(p.note || "pool")}</span>
      </div>`;
    return `<a class="${cls}" href="${esc(playerHref(c, p))}" title="${esc(tip)}">${inner}</a>`;
  }

  function section(title, players, c, extra) {
    if (!players.length) return "";
    return `<div class="ef-section ${extra||''}">
      <div class="ef-section-title">${title}<span class="count">${players.length}</span></div>
      <div class="ef-grid">${players.map(p => card(p, c)).join("")}</div></div>`;
  }

  function renderSquad(c, selectedSquad) {
    const hasSecond = c.players.some(p => p.squad === "second");
    const squad = hasSecond && selectedSquad === "second" ? "second" : "first";
    const players = c.players.filter(p => (p.squad || "first") === squad);
    const byS = (s) => players.filter(p => p.section === s);
    const picker = hasSecond ? `<div class="ef-squad-switch" role="group" aria-label="Choose squad">
      <button class="ef-squad-choice${squad === "first" ? " active" : ""}" data-squad="first">First Squad</button>
      <button class="ef-squad-choice${squad === "second" ? " active" : ""}" data-squad="second">Second Squad</button>
    </div>` : "";
    const root = document.getElementById("ef-squad");
    const tier = GROUPS.find(([g]) => g === c.group);
    const head = `<div class="nation-head">
      <div class="nation-name"><span class="flag">${c.flag||""}</span>${esc(c.name)}
        ${tier ? `<span class="tier" data-tier="${c.group}">${tier[1].replace(/s$/, "")}</span>` : ""}</div>
      ${picker}</div>`;
    if (!players.length) {
      root.innerHTML = head + `<div class="ef-error">No players available for ${esc(c.name)}.</div>` + dropSection(c);
      return;
    }
    root.innerHTML = head +
      section("Starters", byS("starters"), c) +
      section("Substitutes", byS("substitutes"), c) +
      section("Wildcard", byS("wildcard"), c, "ef-wild") + dropSection(c);
    root.querySelectorAll(".ef-squad-choice").forEach(button =>
      button.addEventListener("click", () => renderSquad(c, button.dataset.squad)));
  }

  function dropSection(c) {
    const drops = c.dropouts || [];
    if (!drops.length) return "";
    const avg = drops.reduce((n, d) => n + d.days, 0) / drops.length;
    return `<div class="ef-section">
      <div class="ef-section-title">Drop-outs<span class="count">${drops.length}</span></div>
      ${panel("Left the squad", `avg stint ${avg.toFixed(0)}d`, drops.map(d => dropRow({ c, d }, false)).join(""))}</div>`;
  }

  const POSITION_ORDER = ["GK", "CB", "LB", "RB", "LWB", "RWB",
                          "DMF", "CMF", "AMF", "LMF", "RMF",
                          "CF", "SS", "LWF", "RWF"];
  const firstSquad = (countries) => countries.flatMap(country => country.players
    .filter(player => (player.squad || "first") === "first")
    .map(player => ({ player, country })));
  const byRating = (a, b) =>
    b.player.rating - a.player.rating ||
    a.player.since.localeCompare(b.player.since) ||
    a.player.name.localeCompare(b.player.name);
  const byTenure = (a, b) =>
    joinedOf(a.player).localeCompare(joinedOf(b.player)) ||
    b.player.rating - a.player.rating ||
    a.player.name.localeCompare(b.player.name);
  const root = () => document.getElementById("ef-squad");
  const tierLabel = (c) => {
    const tier = GROUPS.find(([g]) => g === c.group);
    return tier ? `<span class="tier" data-tier="${c.group}">${tier[1].replace(/s$/, "")}</span>` : "";
  };
  const panel = (title, aside, body) => `<div class="panel">
      <div class="panel-head"><span class="title">${title}</span>${aside ? `<span class="aside">${aside}</span>` : ""}</div>
      ${body}</div>`;

  const PITCH_LINES = [
    ["GK", 11, ["GK"]],
    ["DEF", 31, ["LB", "LWB", "CB", "RB", "RWB"]],
    ["MID", 57, ["LMF", "CMF", "DMF", "AMF", "RMF"]],
    ["FWD", 84, ["LWF", "CF", "SS", "RWF"]],
  ];
  const firstStarters = (c) => c.players.filter(p => (p.squad || "first") === "first" && p.section === "starters");
  const countryHash = (id) => [...id].reduce((h, ch) => (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0, 0);
  function dailySquad(countries, day = Math.floor(Date.now() / 86400000)) {
    const eligible = countries.filter(c => firstStarters(c).length);
    if (!eligible.length) return null;
    eligible.sort((a, b) => countryHash(a.id) - countryHash(b.id) || a.id.localeCompare(b.id));
    return eligible[day % eligible.length];
  }

  function pitchHTML(c) {
    const starters = firstStarters(c);
    const nodes = PITCH_LINES.flatMap(([line, x, order]) => {
      const players = starters.filter(p => lineOf(p.pos) === line)
        .sort((a, b) => order.indexOf(a.pos) - order.indexOf(b.pos) || b.rating - a.rating || a.name.localeCompare(b.name));
      return players.map((p, i) => ({ p, x, y: 100 * (i + 1) / (players.length + 1) }));
    }).map(({ p, x, y }) => {
      const inner = `<div class="xi-photo ${ctClass(p.card_type)}">${photoHTML(p)}</div>
        <div class="xi-name">${esc(p.name)}</div>
        <div class="xi-meta">${esc(p.pos)} · <b>${p.rating.toFixed(0)}</b></div>`;
      const style = `left:${x}%;top:${y}%`;
      const tip = esc(`${p.name} · ${c.name} · ${p.pos} · rating ${p.rating.toFixed(0)}`);
      return `<a class="xi-node" style="${style}" href="${esc(playerHref(c, p))}" title="${tip}">${inner}</a>`;
    }).join("");
    return `<div class="pitch-scroll"><div class="pitch"><div class="pm half"></div><div class="pm circle"></div>
      <div class="pm box-left"></div><div class="pm box-right"></div>${nodes}</div></div>`;
  }

  const FEED_DAYS = 7, OV_PREVIEW = 9;
  const expandList = (rows, preview = OV_PREVIEW) => `<div class="xlist">${rows.slice(0, preview).join("")}` + (rows.length > preview
    ? `<div class="xlist-more" hidden>${rows.slice(preview).join("")}</div></div>
       <button class="rank-toggle xlist-toggle" type="button" data-total="${rows.length}" data-preview="${preview}">show all ${rows.length}</button>` : "</div>");
  document.addEventListener("click", e => {
    const toggle = e.target.closest(".xlist-toggle");
    if (!toggle) return;
    const more = toggle.previousElementSibling.querySelector(".xlist-more");
    const panel = toggle.closest(".panel");
    if (panel.parentElement.classList.contains("ov-grid") && more.hidden) {
      panel.style.height = panel.offsetHeight + "px";
      panel.classList.add("locked");
    } else {
      panel.style.height = "";
      panel.classList.remove("locked");
    }
    more.hidden = !more.hidden;
    toggle.textContent = more.hidden ? `show all ${toggle.dataset.total}` : `show top ${toggle.dataset.preview}`;
  });
  function feedHTML(countries) {
    const recent = firstSquad(countries)
      .filter(e => daysSince(joinedOf(e.player)) < FEED_DAYS)
      .sort((a, b) => joinedOf(b.player).localeCompare(joinedOf(a.player)) || byRating(a, b));
    if (!recent.length) return `<div class="feed-more">No new call-ups in the last ${FEED_DAYS} days.</div>`;
    return expandList(recent.map(({ player: p, country: c }) => `
      <a class="feed-row" href="${esc(playerHref(c, p))}" title="${esc(`${p.name} joined ${c.name} on ${joinedOf(p)}`)}">
        <span class="feed-date">${esc(joinedOf(p).slice(5))}</span>
        <span class="feed-who"><b>${esc(p.name)}</b><span>${c.flag||""} ${esc(c.name)} · ${esc(p.section || "")}</span></span>
        <span class="ef-pos" data-line="${lineOf(p.pos)}">${esc(p.pos)}</span>
        <span class="num">${p.rating.toFixed(0)}</span>
      </a>`));
  }

  const allDropouts = (countries) => countries.flatMap(c => (c.dropouts || []).map(d => ({ c, d })));
  const dropRow = ({ c, d }, showNation = true) => `
      <a class="feed-row" href="${esc(playerHref(c, d))}" title="${esc(`${d.name} left ${c.name} on ${d.dropped} after ${d.days} days`)}">
        <span class="feed-date">${esc(d.dropped.slice(5))}</span>
        <span class="feed-who"><b>${esc(d.name)}</b><span>${showNation ? `${c.flag||""} ${esc(c.name)} · ` : ""}${squadLabel(d)} · lasted ${d.days}d</span></span>
        <span class="ef-pos" data-line="${lineOf(d.pos)}">${esc(d.pos)}</span>
        <span class="num">${d.rating.toFixed(0)}</span>
      </a>`;

  function dropFeedHTML(countries) {
    const recent = allDropouts(countries).filter(x => daysSince(x.d.dropped) < FEED_DAYS)
      .sort((a, b) => b.d.dropped.localeCompare(a.d.dropped) || b.d.rating - a.d.rating);
    if (!recent.length) return `<div class="feed-more">No drop-outs in the last ${FEED_DAYS} days.</div>`;
    return expandList(recent.map(x => dropRow(x)));
  }

  const RECORDS_MAX = 12;

  const RANK_PREVIEW = 8;
  function strength(countries) {
    return countries.map(c => {
      const xi = c.players.filter(p => (p.squad || "first") === "first" && p.section === "starters");
      const avg = xi.length ? xi.reduce((n, p) => n + p.rating, 0) / xi.length : 0;
      return { c, avg };
    }).sort((a, b) => b.avg - a.avg || a.c.name.localeCompare(b.c.name));
  }

  function rankingsHTML(rows) {
    const rated = rows.filter(r => r.avg > 0);
    const max = rated.length ? rated[0].avg : 0, min = rated.length ? rated[rated.length - 1].avg : 0;
    const width = (v) => v <= 0 ? 0 : max === min ? 100 : 8 + 92 * (v - min) / (max - min);
    return expandList(rows.map(({ c, avg }, i) => `
      <a class="rank-row" href="#${esc(c.id)}" data-id="${esc(c.id)}" data-tier="${esc(c.group || "")}">

        <span class="rank-nation"><span>${c.flag||""}</span><span class="nm">${esc(c.name)}</span>${tierLabel(c)}</span>
        <span class="bar"><i style="width:${width(avg).toFixed(1)}%"></i></span>
        <span class="num">${avg > 0 ? avg.toFixed(1) : "0"}</span>
      </a>`), RANK_PREVIEW);

  let moverDays = 7;

            <div id="activity-callups" class="tab-view" role="tabpanel">${feedHTML(countries)}</div>

        ${panel("Rank movers", "ladder rank change by card", `<div class="seg" role="group" aria-label="Window">

            <div id="movers"><div class="feed-more">loading history…</div></div>`)}
      </div>
      ${panel("Strength rankings", "average rating of first-squad starters · pick a nation to chart its rank", `<div class="strength">
          <div class="strength-list" id="rankings">${rankingsHTML(rows)}</div>

    document.getElementById("activity-tabs").addEventListener("click", e => {

    loadHistory().then(h => {
