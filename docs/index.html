  function recordCards(entries, squadTenure = false) {
    return `<div class="ef-grid record-grid">${entries.map(x => card(
      squadTenure ? { ...x.player, since: joinedOf(x.player), tenureRank: 0 } : x.player,
      x.country, true)).join("")}</div>`;
  }

  function bestByPosition(countries, cmp) {
    const all = firstSquad(countries);
    return POSITION_ORDER
      .map(pos => all.filter(x => x.player.pos === pos).sort(cmp)[0])
      .filter(Boolean);
  }

  function jerseyRecords(countries, mode) {
    const byNumber = new Map();
    for (const country of countries) for (const player of country.players) {
      if (!byNumber.has(player.number)) byNumber.set(player.number, []);
      byNumber.get(player.number).push({ country, player });
    }
    const compare = mode === "rating" ? byRating : byTenure;
    return [...byNumber].sort(([a], [b]) => a - b)
      .map(([number, entries]) => ({ number, ...entries.sort(compare)[0] }));
  }

  function jerseyTableRows(countries, mode) {
    return jerseyRecords(countries, mode).map(({ number, country: c, player: p }) => `
      <tr>
        <td class="number">#${number}</td>
        <td><a href="${esc(playerHref(c, p))}">${esc(p.name)}</a></td>
        <td class="nation">${c.flag||""} ${esc(c.name)}</td>
        <td><span class="ef-pos" data-line="${lineOf(p.pos)}">${esc(p.pos)}</span></td>
        <td class="metric" title="${mode === "tenure" ? `In the squad since ${esc(joinedOf(p))}` : `Rated ${p.rating.toFixed(2)}`}">
          ${mode === "tenure" ? `${daysSince(joinedOf(p))}d` : p.rating.toFixed(2)}</td>
      </tr>`).join("");
  }

  function jerseyTable(countries, mode) {
    const rating = mode === "rating";
    return `<div class="jersey-table-wrap"><table class="jersey-table" aria-label="${rating ? "Highest rating" : "Longest serving"} by jersey number">
      <thead><tr><th scope="col">No.</th><th scope="col">Player</th><th scope="col">Nation</th><th scope="col">Pos</th><th scope="col" class="metric">${rating ? "Rating" : "Days"}</th></tr></thead>
      <tbody>${jerseyTableRows(countries, mode)}</tbody>
    </table></div>`;
  }

  function renderRecords(countries) {
    const numberCount = new Set(countries.flatMap(c => c.players.map(p => p.number))).size;
    const rated = bestByPosition(countries, byRating);
    const serving = bestByPosition(countries, byTenure);
    root().innerHTML =
      panel("Players by position", `${countries.length} nations · first squads`, `<div class="seg" id="position-tabs" role="tablist" aria-label="Player records by position">
          <button type="button" role="tab" data-position-record="rating" aria-controls="position-rating" aria-selected="true" class="active">Highest rating</button>
          <button type="button" role="tab" data-position-record="tenure" aria-controls="position-tenure" aria-selected="false">Longest serving</button></div>
          <div id="position-rating" class="tab-view" role="tabpanel">${recordCards(rated)}</div>
          <div id="position-tenure" class="tab-view" role="tabpanel" hidden>${recordCards(serving, true)}</div>`) +
      `<div class="ov-grid ov-even">
        ${panel("Highest rating by jersey number", `${numberCount} numbers worn`, jerseyTable(countries, "rating"))}
        ${panel("Longest serving by jersey number", `${numberCount} numbers worn`, jerseyTable(countries, "tenure"))}
      </div>` +
      `<div class="ov-grid ov-even">
        ${panel("Longest stints ended", "drop-outs by days in squad",
          allDropouts(countries).sort((a, b) => b.d.days - a.d.days).slice(0, RECORDS_MAX).map(x => dropRow(x)).join(""))}
        ${panel("Most call-ups", "current players with the most separate stints",
          firstSquad(countries).concat(countries.flatMap(country => country.players
              .filter(p => p.squad === "second").map(player => ({ player, country }))))
            .filter(x => (x.player.callups || 1) > 1)
            .sort((a, b) => b.player.callups - a.player.callups || byRating(a, b)).slice(0, RECORDS_MAX)
            .map(({ player: p, country: c }) => `
              <a class="feed-row" href="${esc(playerHref(c, p))}">
                <span class="feed-date">×${p.callups}</span>
                <span class="feed-who"><b>${esc(p.name)}</b><span>${c.flag||""} ${esc(c.name)} · ${squadLabel(p)}</span></span>
                <span class="ef-pos" data-line="${lineOf(p.pos)}">${esc(p.pos)}</span>
                <span class="num">${p.rating.toFixed(0)}</span>
              </a>`).join("") || `<div class="feed-more">Nobody has been called up twice yet.</div>`)}
      </div>`;
    document.getElementById("position-tabs").addEventListener("click", e => {
      const button = e.target.closest("button[data-position-record]");
      if (!button) return;
      const active = button.dataset.positionRecord;
      document.querySelectorAll("#position-tabs button").forEach(b => {
        b.classList.toggle("active", b === button);
        b.setAttribute("aria-selected", String(b === button));
      });
      document.getElementById("position-rating").hidden = active !== "rating";
      document.getElementById("position-tenure").hidden = active !== "tenure";
    });
  }

  const statHTML = (value, label) => `<div class="stat"><span>${label}</span><b>${value}</b></div>`;
  const SECTION_LABEL = { starters:"Starter", substitutes:"Substitute", wildcard:"Wildcard" };
  const ordinalMedal = (r) => r ? `${MEDAL[r]} ${["", "1st", "2nd", "3rd"][r]}` : "—";

  const STATUS_ORDER = { squad: 0, dropped: 1, pool: 2 };
  function buildIndex(countries, pools) {
    const byKey = new Map();
    const get = (c, name, status) => {
      const key = `${c.id}/${slug(name)}`;
      if (!byKey.has(key)) byKey.set(key, { key, c, status, apps: [] });
      return byKey.get(key);
    };
    for (const c of countries) {
      for (const p of c.players) get(c, p.name, "squad").apps.push(p);
      for (const d of c.dropouts || []) {
        const e = get(c, d.name, "dropped");
        if (e.status === "dropped" && !e.drop) e.drop = d;
      }
      for (const row of (pools && pools[c.id]) || []) get(c, row.name, "pool").pool = row;
    }
    for (const e of byKey.values()) {
      const best = e.pool && e.pool.rows[0];
      if (e.status === "squad") {
        e.apps.sort((a, b) => (a.squad === "second") - (b.squad === "second"));
        e.p = e.apps[0];
      } else if (e.status === "dropped") {
        const row = e.pool && e.pool.rows.find(r => r[0] === e.drop.pos);
        e.p = { ...e.drop, card_type: row ? row[2] : "Standard",
                img: e.drop.img || (e.pool && e.pool.img), tm: e.drop.tm || (e.pool && e.pool.tm) };
      } else {
        e.p = { name: e.pool.name, pos: best[0], rating: best[1], card_type: best[2],
                img: e.pool.img, tm: e.pool.tm };
      }
      e.chars = fold(e.p.name);
    }
    return byKey;
  }

  function fuzzy(q, t) {
    let score = 0, ti = 0, prev = -2;
    const pos = [];
    for (const qc of q) {
      if (qc === " ") continue;
      let idx = -1;
      for (let k = ti; k < t.length; k++) if (t[k] === qc) { idx = k; break; }
      if (idx < 0) return null;
      let bonus = 1;
      if (idx === prev + 1) bonus += 5;
      if (idx === 0 || /[\s\-'.]/.test(t[idx - 1])) bonus += 8;
      score += bonus; pos.push(idx); prev = idx; ti = idx + 1;
    }
    const qs = q.join("").trim();
    if (qs && t.join("").includes(qs)) score += 15;
    return { score: score - t.length * 0.1 - (pos[0] || 0) * 0.2, pos };
  }

  const cardsOf = (e) => {
    const current = [
      ...e.apps.map(a => [a.pos, a.rating]),
      ...(e.pool ? e.pool.rows.map(r => [r[0], r[1]]) : []),
    ];
    return (current.length ? current : e.drop ? [[e.drop.pos, e.drop.rating]] : [])
      .sort((a, b) => b[1] - a[1]);
  };

  const POSITIONS = new Set(POSITION_ORDER.map(p => p.toLowerCase()));
  const words = (str) => fold(str).join("").replace(/[^a-z0-9]+/g, " ").trim();

  function parseQuery(query, countries, minLen) {
    let text = ` ${words(query)} `;
    const nations = new Set(), positions = new Set();
    const names = countries.map(c => ({ c, forms: [...new Set([words(c.name), words(c.id)])] }))
      .sort((a, b) => b.forms[0].length - a.forms[0].length);
    for (const { c, forms } of names) {
      for (const f of forms) {
        if (f.includes(" ") && text.includes(` ${f} `)) { nations.add(c.id); text = text.replace(` ${f} `, " "); }
      }
    }
    const rest = [];
    for (const t of text.trim().split(/\s+/).filter(Boolean)) {
      if (POSITIONS.has(t)) { positions.add(t.toUpperCase()); continue; }
      const hits = names.filter(({ forms }) => forms.some(f =>
        f.split(" ").includes(t) || (t.length >= minLen && f.split(" ").some(w => w.startsWith(t)))));
      if (hits.length) hits.forEach(({ c }) => nations.add(c.id));
      else rest.push(t);
    }
    return { nations, positions, name: rest.join(" ") };
  }

  function searchPlayers(index, countries, query, limit) {
    const plain = (pool) => {
      const q = fold(query.trim());
      if (!q.length) return [];
      const hits = [];
      for (const e of pool) {
        const m = fuzzy(q, e.chars);
        if (m) hits.push({ e, ...m });
      }
      return hits;
    };
    const rank = (hits) => hits.sort((a, b) => Math.round(b.score) - Math.round(a.score) || STATUS_ORDER[a.e.status] - STATUS_ORDER[b.e.status]
      || (b.card || [0, b.e.p.rating])[1] - (a.card || [0, a.e.p.rating])[1]);
    const filtered = (f) => {
      if (!f.nations.size && !f.positions.size) return null;
      const hits = [];
      for (const e of index.values()) {
        if (f.nations.size && !f.nations.has(e.c.id)) continue;
        const card = f.positions.size ? cardsOf(e).find(([pos]) => f.positions.has(pos)) : null;
        if (f.positions.size && !card) continue;
        let m = { score: 0, pos: [] };
        if (f.name) {
          m = fuzzy(fold(f.name), e.chars);
          if (!m) continue;
        }
        hits.push({ e, ...m, card });
      }
      return hits.length ? { filters: f, total: hits.length, hits: rank(hits).slice(0, limit) } : null;
    };
    const strict = filtered(parseQuery(query, countries, 4));
    if (strict) return strict;
    const hits = plain(index.values());
    if (hits.length) return { filters: null, total: hits.length, hits: rank(hits).slice(0, limit) };
    return filtered(parseQuery(query, countries, 3)) || { filters: null, total: 0, hits: [] };
  }

  const STATUS_TEXT = { squad: "in squad", dropped: "dropped", pool: "not called up" };
  const highlight = (name, pos) => {
    const set = new Set(pos);
    return [...name].map((ch, i) => set.has(i) ? `<mark>${esc(ch)}</mark>` : esc(ch)).join("");
  };

  function bindPlayerSearch(index, countries) {
    const box = document.getElementById("psearch");
    const input = document.getElementById("player-search");
    const out = document.getElementById("ps-results");
    let hits = [], sel = 0;
    const close = () => { out.hidden = true; box.setAttribute("aria-expanded", "false"); };
    const paint = () => {
      out.querySelectorAll(".ps-item").forEach((el, i) => el.classList.toggle("sel", i === sel));
      const cur = out.querySelector(".ps-item.sel");
      if (cur) cur.scrollIntoView({ block: "nearest" });
    };
    const render = () => {
      const res = searchPlayers(index, countries, input.value, 8);
      hits = res.hits;
      sel = 0;
      if (!input.value.trim()) return close();
      const f = res.filters;
      const byId = (id) => countries.find(c => c.id === id);
      const head = f ? `<div class="ps-filters">${[...f.nations].map(id => `<span class="chip">${byId(id).flag||""} ${esc(byId(id).name)}</span>`).join("")}${[...f.positions].map(p => `<span class="chip">${p}</span>`).join("")}${f.name ? `<span class="chip">“${esc(f.name)}”</span>` : ""}</div>` : "";
      const more = res.total > hits.length ? `<div class="ps-empty">${res.total - hits.length} more · keep typing to narrow</div>` : "";
      out.innerHTML = hits.length ? head + hits.map(({ e, pos, card }, i) => `
        <a class="ps-item" role="option" href="#/player/${esc(e.key)}${card ? "/" + esc(card[0]) : ""}" data-i="${i}">
          <span class="ps-thumb">${photoHTML(e.p)}</span>
          <span><div class="ps-name">${highlight(e.p.name, pos)}</div>
                <div class="ps-meta">${e.c.flag||""} ${esc(e.c.name)} · ${esc(card ? card[0] : e.p.pos)} · ${STATUS_TEXT[e.status]}</div></span>
          <span class="num">${(card ? card[1] : e.p.rating).toFixed(0)}</span>
        </a>`).join("") + more : `<div class="ps-empty">no players match “${esc(input.value.trim())}”.</div>`;
      out.hidden = false; box.setAttribute("aria-expanded", "true");
      paint();
    };
    const go = (i) => {
      if (!hits[i]) return;
      location.hash = `/player/${hits[i].e.key}${hits[i].card ? "/" + hits[i].card[0] : ""}`;
      input.value = ""; close(); input.blur();
    };
    input.addEventListener("input", render);
    input.addEventListener("focus", () => { if (input.value.trim()) render(); });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); paint(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); paint(); }
      else if (e.key === "Enter") { e.preventDefault(); go(sel); }
      else if (e.key === "Escape") { input.value = ""; close(); input.blur(); }
    });
    out.addEventListener("click", e => {
      const item = e.target.closest(".ps-item");
      if (!item) return;
      e.preventDefault(); go(+item.dataset.i);
    });
    document.addEventListener("click", e => { if (!box.contains(e.target)) close(); });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
    });
  }

  const squadLabel = (p) => `${p.squad === "second" ? "Second" : "First"} squad · ${SECTION_LABEL[p.section] || "—"}`;
  const signed = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);

  let historyLoad = null;
  const loadHistory = () => historyLoad || (historyLoad =
    fetch(HISTORY_URL + "?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null));

  const SQUAD_NAME = { first: "First squad", second: "Second squad" };
  const hc = (text, cls = "") => `<span class="hc ${cls}">${text}</span>`;
  const moved = (from, to) => Math.abs(to - from) > 0.025;
  const delta = (from, to) => hc(`rating ${from.toFixed(2)} → ${to.toFixed(2)}`, to > from ? "up" : "down");

  function describeChange(prev, cur) {
    const out = [];
    if (prev && prev.pos && cur.pos && prev.pos !== cur.pos &&
        (prev.p || prev.a.length) && (cur.p || cur.a.length))
      out.push(hc(`position ${esc(prev.pos)} → ${esc(cur.pos)}`, "card"));
    const bySquad = (snap) => Object.fromEntries(((snap && snap.a) || []).map(a => [a[0], a]));
    const before = bySquad(prev), after = bySquad(cur);
    const both = Object.keys(after).length > 1;
    for (const squad of ["first", "second"]) {
      const was = before[squad], now = after[squad];
      const tag = (text, cls) => hc(`${both ? SQUAD_NAME[squad] + " · " : ""}${text}`, cls);
      if (now && !was) {
        const [, section, slot, number, rating] = now;
        out.push(hc(`called up · ${SQUAD_NAME[squad]} · ${SECTION_LABEL[section] || "—"}${slot ? ` · ${esc(slot)} slot` : ""} · #${number} · ${rating.toFixed(2)}`, "in"));
      } else if (was && !now) {
        out.push(hc(`left ${SQUAD_NAME[squad]}`, "out"));
      } else if (was && now) {
        if (was[1] !== now[1]) out.push(tag(`${SECTION_LABEL[was[1]] || "—"} → ${SECTION_LABEL[now[1]] || "—"}`));
        if (was[2] !== now[2]) out.push(tag(`slot ${esc(was[2])} → ${esc(now[2])}`));
        if (was[3] !== now[3]) out.push(tag(`#${was[3]} → #${now[3]}`));
        if (moved(was[4], now[4])) out.push(delta(was[4], now[4]));
      }
    }
    const pp = prev && prev.p, cp = cur.p;
    if (cp && !pp) out.push(hc(`${prev ? "card back in pool" : "card added"} · ${esc(cp[1])} · ${cp[0].toFixed(2)}${cp[2] ? " · recent" : ""}`, "card"));
    if (pp && !cp) out.push(hc("card removed from pool", "out"));
    if (pp && cp) {
      if (pp[1] !== cp[1]) out.push(hc(`card ${esc(pp[1])} → ${esc(cp[1])}`, "card"));
      if (pp[2] !== cp[2]) out.push(hc(cp[2] ? "now a recent card" : "no longer a recent card"));
      if (moved(pp[0], cp[0]) && !cur.a.length && !prev.a.length) out.push(delta(pp[0], cp[0]));
    }
    return out;
  }

  function cardHistoryHTML(snaps) {
    if (!snaps || !snaps.length) return `<div class="feed-more">No history recorded for this card.</div>`;
    const numbers = [...new Set(snaps.flatMap(s => s.a.map(a => a[3])))];
    const types = [...new Set(snaps.filter(s => s.p).map(s => s.p[1]))];
    const ratings = snaps.flatMap(s => s.a.map(a => a[4]).concat(s.p ? [s.p[0]] : []));
    const listed = snaps.find(s => s.a.length);
    const facts = [
      listed ? `first listed ${esc(listed.d)}` : "never listed in a squad",
      numbers.length ? `numbers worn ${numbers.map(n => "#" + n).join(" ")}` : "",
      types.length ? `card ${types.map(esc).join(" → ")}` : "",
      ratings.length ? `peak ${Math.max(...ratings).toFixed(2)}` : "",
    ].filter(Boolean).map(f => `<span class="chip">${f}</span>`).join("");
    const rows = snaps.map((s, i) => ({ d: s.d, changes: describeChange(snaps[i - 1], s) }))
      .filter(r => r.changes.length).reverse()
      .map(r => `<div class="hist-row"><span class="feed-date">${esc(r.d)}</span><div class="hist-changes">${r.changes.join("")}</div></div>`)
      .join("");
    return `<div class="hist-facts">${facts}</div>${rows}`;
  }

  function ladderSeries(h, pos, target) {
    const cards = [];
    const positions = new Set(target.map(s => s.pos || pos));
    for (const nation of Object.values(h.countries))
      for (const byPos of Object.values(nation))
        for (const [cardPos, snaps] of Object.entries(byPos))
          if (snaps !== target && snaps.some(s => positions.has(s.pos || cardPos)))
            cards.push({ pos: cardPos, snaps });
    const dates = [...new Set([...cards.flatMap(c => c.snaps), ...target].map(x => x.d))].sort();
    const ptr = new Array(cards.length).fill(-1);
    let tp = -1;
    const listedRating = (snap) => snap && snap.a.length ? Math.max(...snap.a.map(a => a[4])) : null;
    const points = [];
    for (const d of dates) {
      while (tp + 1 < target.length && target[tp + 1].d <= d) tp++;
      const me = tp >= 0 ? target[tp] : null;
      const currentPos = me && me.pos || pos;
      let above = 0, total = 0;
      const mine = listedRating(me);
      const ref = mine != null ? mine : me && me.p ? me.p[0] : null;
      cards.forEach(({ pos: cardPos, snaps }, i) => {
        while (ptr[i] + 1 < snaps.length && snaps[ptr[i] + 1].d <= d) ptr[i]++;
        const snap = ptr[i] >= 0 ? snaps[ptr[i]] : null;
        const r = snap && (snap.pos || cardPos) === currentPos ? listedRating(snap) : null;
        if (r == null) return;
        total++;
        if (ref != null && r > ref) above++;
      });
      const point = ref == null ? { d, rank: null, pos: currentPos } :
        { d, rank: above + 1, total: total + (mine != null ? 1 : 0), listed: mine != null, pos: currentPos };
      const last = points[points.length - 1];
      if (!last || last.rank !== point.rank || last.total !== point.total || last.listed !== point.listed || last.pos !== point.pos) points.push(point);
    }
    return points.filter((pt, i) => pt.rank != null || (points[i - 1] && points[i - 1].rank != null));
  }

  const RC = { W: 600, H: 150, L: 34, R: 10, T: 12, B: 22 };
  const chartH = (kind) => kind === "nation" ? 190 : RC.H;
  const dayMs = (d) => new Date(d + "T00:00:00Z").getTime();
  const chartScale = (points, H = RC.H) => {
    const { W, L, R, T, B } = RC;
    const today = new Date().toISOString().slice(0, 10);
    const x0 = dayMs(points[0].d), x1 = Math.max(dayMs(today), x0 + 86400000);
    const maxRank = Math.max(5, ...points.filter(p => p.rank != null).map(p => p.rank));
    return {
      today, x0, x1, maxRank,
      X: (d) => L + (W - L - R) * (dayMs(d) - x0) / (x1 - x0),
      Y: (r) => T + (H - T - B) * (r - 1) / (maxRank - 1),
    };
  };
  const rankText = (p, pos, kind) => p.rank == null ? (kind === "nation" ? "no first-squad starters" : "not rated")
    : kind === "nation" ? `#${p.rank} of ${p.total} nations · starters avg ${p.avg.toFixed(2)}`
    : p.listed ? `#${p.rank} of ${p.total} ${esc(p.pos || pos)}s · in squad`
    : `would rank #${p.rank} of ${p.total} · not in a squad, placed by its pool rating`;

  function rankChartHTML(points, pos, kind = "card") {
    const ranked = points.filter(p => p.rank != null);
    if (!ranked.length) return "";
    const { W, L, R } = RC, H = chartH(kind);
    const { today, maxRank, X, Y } = chartScale(points, H);
    let segs = "";
    points.forEach((p, i) => {
      if (p.rank == null) return;
      const xa = X(p.d), xb = X(points[i + 1] ? points[i + 1].d : today), y = Y(p.rank);
      segs += `<line x1="${xa.toFixed(1)}" y1="${y.toFixed(1)}" x2="${xb.toFixed(1)}" y2="${y.toFixed(1)}" class="${p.listed ? "rk-on" : "rk-off"}"/>`;
      const next = points[i + 1];
      if (next && next.rank != null) segs += `<line x1="${xb.toFixed(1)}" y1="${y.toFixed(1)}" x2="${xb.toFixed(1)}" y2="${Y(next.rank).toFixed(1)}" class="${next.listed && p.listed ? "rk-on" : "rk-off"} rk-step"/>`;
      const prev = points[i - 1];
      if (!prev || prev.rank !== p.rank || prev.listed !== p.listed) segs += `<circle cx="${xa.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" class="${p.listed ? "rk-on" : "rk-off"}"><title>${p.d}: ${p.listed ? "" : "would rank "}#${p.rank} of ${p.total}</title></circle>`;
    });
    const listed = ranked.filter(p => p.listed);
    const best = listed.length ? listed.reduce((a, b) => b.rank < a.rank ? b : a) : null;
    const worst = listed.length ? listed.reduce((a, b) => b.rank > a.rank ? b : a) : null;
    const now = points[points.length - 1];
    const facts = kind === "nation" ? [
      now.rank != null ? `now #${now.rank} of ${now.total}` : "unranked now",
      best ? `best #${best.rank} · ${best.d}` : "",
      worst && worst !== best ? `worst #${worst.rank} · ${worst.d}` : "",
    ].filter(Boolean).map(f => `<span class="chip">${f}</span>`).join("") : [
      now.rank != null ? `${now.listed ? "now" : "would rank"} #${now.rank} of ${now.total}` : "not rated now",
      best ? `best #${best.rank} · ${best.d}` : "never listed",
      worst && worst !== best ? `worst #${worst.rank} · ${worst.d}` : "",
    ].filter(Boolean).map(f => `<span class="chip">${f}</span>`).join("");
    return `<div class="rank-chart" data-kind="${kind}" data-pos="${esc(pos)}" data-points="${esc(JSON.stringify(points))}">
      <div class="rank-chart-head"><span>${kind === "nation" ? "strength rank" : "ladder rank"}</span>${facts}</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ladder rank over time">
        <line x1="${L}" y1="${Y(1)}" x2="${W - R}" y2="${Y(1)}" class="rk-grid"/>
        <line x1="${L}" y1="${Y(maxRank)}" x2="${W - R}" y2="${Y(maxRank)}" class="rk-grid"/>
        <text x="${L - 6}" y="${Y(1) + 4}" text-anchor="end">#1</text>
        <text x="${L - 6}" y="${Y(maxRank) + 4}" text-anchor="end">#${maxRank}</text>
        <text x="${L}" y="${H - 4}">${points[0].d}</text>
        <text x="${W - R}" y="${H - 4}" text-anchor="end">today</text>
        ${segs}
        <line class="rk-guide" x1="0" y1="${RC.T}" x2="0" y2="${H - RC.B}" visibility="hidden"/>
        <circle class="rk-marker" r="4.5" cx="0" cy="0" visibility="hidden"/>
      </svg>
      <div class="rank-readout"></div>
      ${kind === "nation" ? "" : `<div class="rank-legend"><span class="on"></span>in squad<span class="off"></span>not in a squad — where its pool rating would place it</div>`}
    </div>`;
  }

  function bindRankChart(container) {
    const chart = container.querySelector(".rank-chart");
    if (!chart) return;
    const points = JSON.parse(chart.dataset.points);
    const kind = chart.dataset.kind;
    const { x0, x1, X, Y } = chartScale(points, chartH(kind));
    const svg = chart.querySelector("svg");
    const guide = svg.querySelector(".rk-guide"), marker = svg.querySelector(".rk-marker");
    const out = chart.querySelector(".rank-readout");
    const at = (t) => {
      let hit = points[0];
      for (const p of points) if (dayMs(p.d) <= t) hit = p;
      return hit;
    };
    const show = (t, pinned) => {
      const p = at(t);
      const day = new Date(t).toISOString().slice(0, 10);
      const x = X(day);
      guide.setAttribute("x1", x); guide.setAttribute("x2", x);
      guide.setAttribute("visibility", pinned ? "visible" : "hidden");
      if (p.rank != null) {
        marker.setAttribute("cx", x); marker.setAttribute("cy", Y(p.rank));
        marker.setAttribute("class", `rk-marker ${p.listed ? "rk-on" : "rk-off"}`);
      }
      marker.setAttribute("visibility", pinned && p.rank != null ? "visible" : "hidden");
      out.innerHTML = `<b>${pinned ? day : "today"}</b> ${rankText(p, chart.dataset.pos, kind)}`;
    };
    const fromEvent = (e) => {
      const r = svg.getBoundingClientRect();
      const vx = Math.min(RC.W - RC.R, Math.max(RC.L, (e.clientX - r.left) * RC.W / r.width));
      return x0 + (vx - RC.L) / (RC.W - RC.L - RC.R) * (x1 - x0);
    };
    svg.addEventListener("pointermove", e => show(fromEvent(e), true));
    svg.addEventListener("pointerdown", e => show(fromEvent(e), true));
    svg.addEventListener("pointerleave", () => show(x1, false));
    show(x1, false);
  }

  function nationRankSeries(h) {
    const nations = Object.entries(h.countries).map(([id, players]) => ({
      id, cards: Object.values(players).flatMap(byPos => Object.values(byPos)),
    }));
    const dates = [...new Set(nations.flatMap(n => n.cards.flatMap(snaps => snaps.map(x => x.d))))].sort();
    const ptrs = nations.map(n => new Array(n.cards.length).fill(-1));
    const series = Object.fromEntries(nations.map(n => [n.id, []]));
    for (const d of dates) {
      const avgs = nations.map((n, ni) => {
        let sum = 0, count = 0;
        n.cards.forEach((snaps, ci) => {
          const ptr = ptrs[ni];
          while (ptr[ci] + 1 < snaps.length && snaps[ptr[ci] + 1].d <= d) ptr[ci]++;
          if (ptr[ci] < 0) return;
          for (const a of snaps[ptr[ci]].a) if (a[0] === "first" && a[1] === "starters") { sum += a[4]; count++; }
        });
        return { id: n.id, avg: count ? sum / count : null };
      });
      const ranked = avgs.filter(x => x.avg != null).sort((a, b) => b.avg - a.avg);
      const rankOf = new Map(ranked.map((x, i) => [x.id, i + 1]));
      for (const x of avgs) {
        const point = x.avg == null ? { d, rank: null } : { d, rank: rankOf.get(x.id), total: nations.length, avg: x.avg, listed: true };
        const pts = series[x.id], last = pts[pts.length - 1];
        if (!last || last.rank !== point.rank || last.total !== point.total) pts.push(point);
      }
    }
    for (const id in series) {
      const pts = series[id];
      while (pts.length && pts[0].rank == null) pts.shift();
    }
    return series;
  }

  function ladderRanksOn(h, day) {
    const byPos = {};
    for (const [nid, players] of Object.entries(h.countries))
      for (const [name, cards] of Object.entries(players))
        for (const [pos, snaps] of Object.entries(cards)) {
          let snap = null;
          for (const x of snaps) { if (x.d <= day) snap = x; else break; }
          if (!snap || !snap.a.length) continue;
          const actualPos = snap.pos || pos;
          (byPos[actualPos] = byPos[actualPos] || []).push({ key: `${nid}|${name}|${pos}`, rating: Math.max(...snap.a.map(a => a[4])) });
        }
    const ranks = new Map();
    for (const list of Object.values(byPos))
      for (const c of list) ranks.set(c.key, { rank: 1 + list.filter(o => o.rating > c.rating).length, total: list.length });
    return ranks;
  }

  const MOVER_MAX = 4;
  function moversHTML(h, countries, days) {
    const today = new Date().toISOString().slice(0, 10);
    const then = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
    const now = ladderRanksOn(h, today), before = ladderRanksOn(h, then);
    const moves = [];
    for (const [key, r] of now) {
      const b = before.get(key);
      if (b && b.rank !== r.rank) moves.push({ key, from: b.rank, to: r.rank, total: r.total, delta: b.rank - r.rank });
    }
    const byId = new Map(countries.map(c => [c.id, c]));
    const spark = (key) => {
      const [nid, name, pos] = key.split("|");
      const pts = ladderSeries(h, pos, h.countries[nid][name][pos]).filter(p => p.listed && p.d >= then);
      if (pts.length < 1) return "";
      const W = 84, H = 24, t0 = dayMs(then), t1 = Date.now();
      const ranks = pts.map(p => p.rank), lo = Math.min(...ranks), hi = Math.max(...ranks);
      const x = (d) => (W * (Math.max(dayMs(d), t0) - t0) / (t1 - t0)).toFixed(1);
      const y = (r) => (hi === lo ? H / 2 : 2 + (H - 4) * (r - lo) / (hi - lo)).toFixed(1);
      let path = "";
      pts.forEach((p, i) => {
        const xa = x(p.d), xb = pts[i + 1] ? x(pts[i + 1].d) : W;
        path += `${i ? "L" : "M"}${xa},${y(p.rank)} L${xb},${y(p.rank)} `;
      });
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${path}"/></svg>`;
    };
    const row = (m) => {
      const [nid, name, pos] = m.key.split("|");
      const c = byId.get(nid);
      if (!c) return "";
      return `<a class="mover-row" href="#/player/${esc(nid)}/${esc(slug(name))}/${esc(pos)}" title="${esc(`${name} (${pos}): #${m.from} → #${m.to} of ${m.total}`)}">
        <span class="feed-who"><b>${esc(name)}</b><span>${c.flag||""} ${esc(c.name)} · ${esc(pos)}</span></span>
        ${spark(m.key)}
        <span class="mover-ranks">#${m.from} → #${m.to}</span>
        <span class="mover-delta ${m.delta > 0 ? "up" : "down"}">${m.delta > 0 ? "▲" : "▼"}${Math.abs(m.delta)}</span>
      </a>`;
    };
    const up = moves.filter(m => m.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, MOVER_MAX);
    const down = moves.filter(m => m.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, MOVER_MAX);
    return `<div class="mover-label">climbers</div>${up.map(row).join("") || `<div class="feed-more">No climbers.</div>`}
      <div class="mover-label">fallers</div>${down.map(row).join("") || `<div class="feed-more">No fallers.</div>`}`;
  }

  function cardOrder(cards, current) {
    const latest = (snaps) => { const s = snaps[snaps.length - 1]; return s.p ? s.p[0] : (s.a[0] ? s.a[0][4] : 0); };
    return Object.keys(cards).sort((a, b) => (b === current) - (a === current) || latest(cards[b]) - latest(cards[a]));
  }

  const goCard = (entry, pos) => location.replace(`#/player/${entry.key}/${pos}`);

  function fillHistory(entry, pos) {
    loadHistory().then(h => {
      const box = document.getElementById("pl-history");
      if (!box || box.dataset.key !== entry.key) return;
      if (!h) {
        box.innerHTML = panel("Card history", "unavailable", `<div class="feed-more">Couldn't load history.</div>`);
        return;
      }
      const nation = (h.countries && h.countries[entry.c.id]) || {};
      const name = Object.keys(nation).find(n => n === entry.p.name)
        || Object.keys(nation).find(n => slug(n) === slug(entry.p.name));
      const cards = name ? nation[name] : {};
      const currentPositions = new Set(cardsOf(entry).map(([cardPos]) => cardPos));
      const order = cardOrder(cards, null).filter(cardPos => currentPositions.has(cardPos));
      const show = order.includes(pos) ? pos : order[0];
      const tabs = order.length > 1 ? `<div class="card-tabs" role="tablist">${order.map(k =>
        `<button role="tab" class="card-tab${k === show ? " active" : ""}" data-pos="${esc(k)}" aria-selected="${k === show}">${esc(k)}</button>`).join("")}</div>` : "";
      const snaps = cards[show];
      box.innerHTML = panel(`Card history${show ? ` · ${esc(show)}` : ""}`,
        `${order.length} card${order.length === 1 ? "" : "s"} · ${snaps ? snaps.length : 0} recorded change${snaps && snaps.length === 1 ? "" : "s"}`,
        tabs + (snaps ? rankChartHTML(ladderSeries(h, show, snaps), show) : "") + cardHistoryHTML(snaps));
      bindRankChart(box);
      box.querySelectorAll(".card-tab").forEach(t => t.addEventListener("click", () => goCard(entry, t.dataset.pos)));
    });
  }

  function cardInfo(entry, pos) {
    const listings = entry.apps.filter(a => a.pos === pos);
    const row = entry.pool && entry.pool.rows.find(r => r[0] === pos);
    const drop = entry.drop && entry.drop.pos === pos ? entry.drop : null;
    const rating = listings.length ? Math.max(...listings.map(a => a.rating))
      : row ? row[1] : drop ? drop.rating : entry.p.rating;
    const type = (listings[0] && listings[0].card_type) || (row && row[2]) || entry.p.card_type || "Standard";
    return { pos, rating, type, recent: !!(row && row[5]), listing: listings[0] || null, drop };
  }

  function cardLadder(index, entry, card) {
    const rows = [];
    for (const e of index.values()) {
      if (e.status !== "squad") continue;
      const at = e.apps.filter(a => a.pos === card.pos);
      if (at.length) rows.push({ e, r: Math.max(...at.map(a => a.rating)) });
    }
    if (!card.listing) rows.push({ e: entry, r: card.rating, extra: true });
    rows.sort((a, b) => b.r - a.r || a.e.p.name.localeCompare(b.e.p.name));
    let above = 0;
    rows.forEach((x, i) => {
      if (i && x.r < rows[i - 1].r) above = rows.slice(0, i).filter(y => !y.extra).length;
      x.rank = above + 1;
    });
    const at = rows.findIndex(x => x.e === entry);
    return { rows, at, rank: rows[at].rank, listed: rows.filter(x => !x.extra).length };
  }

  function renderPlayer(entry, index, wantPos) {
    const { c, p, status } = entry;
    const inSquad = status === "squad";
    const positions = [...new Set(cardsOf(entry).map(([pos]) => pos))];
    const pos = positions.includes(wantPos) ? wantPos :
      positions.includes(p.pos) ? p.pos : positions[0];
    const cards = positions.map(k => {
      const info = cardInfo(entry, k);
      return { ...info, ladder: cardLadder(index, entry, info) };
    });
    const cur = cards.find(x => x.pos === pos);
    const { listing } = cur;
    const lad = cur.ladder, at = lad.at, ladderAll = lad.rows;
    const rankLabel = (x) => x.listing ? `#${x.ladder.rank}` : `~#${x.ladder.rank}`;

    const lo = Math.max(0, Math.min(at - 3, ladderAll.length - 7));
    const maxR = ladderAll[0].r, minR = ladderAll[ladderAll.length - 1].r;
    const w = (v) => maxR === minR ? 100 : 8 + 92 * (v - minR) / (maxR - minR);
    const ladderRows = ladderAll.slice(lo, lo + 7).map(({ e, r, rank }) => {
      const shown = e === entry && !listing ? "→" : rank;
      return `<a class="rank-row${e === entry ? " me" : ""}" href="#/player/${esc(e.key)}/${esc(pos)}">
        <span class="rank-n">${typeof shown === "number" ? String(shown).padStart(2, "0") : shown}</span>
        <span class="rank-nation"><span>${e.c.flag||""}</span><span class="nm">${esc(e.p.name)}</span></span>
        <span class="bar"><i style="width:${w(r).toFixed(1)}%"></i></span>
        <span class="num">${r.toFixed(0)}</span>
      </a>`;
    }).join("");
    const ladderTabs = cards.length > 1 ? `<div class="card-tabs" role="tablist">${cards.map(x =>
      `<button role="tab" class="card-tab ladder-tab${x.pos === pos ? " active" : ""}" data-pos="${esc(x.pos)}" aria-selected="${x.pos === pos}">${esc(x.pos)} <span class="tab-rank">${rankLabel(x)}</span></button>`).join("")}</div>` : "";

    const nationAtPos = c.players.filter(x => x.pos === pos && !entry.apps.includes(x))
      .sort((a, b) => b.rating - a.rating);
    const weakest = nationAtPos[nationAtPos.length - 1];
    const STATUS_NOTE = { squad: "listed elsewhere", dropped: "dropped", pool: "not called up" };
    const poolAtPos = [];
    for (const e of index.values()) {
      if (e.c !== c || e === entry || !e.pool || e.apps.some(a => a.pos === pos)) continue;
      const row = e.pool.rows.find(r => r[0] === pos);
      if (row) poolAtPos.push({ name: e.p.name, pos, rating: row[1], card_type: row[2], img: e.p.img, tm: e.p.tm, note: STATUS_NOTE[e.status] });
    }
    poolAtPos.sort((a, b) => b.rating - a.rating);
    const gapStat = weakest
      ? statHTML(`${signed(cur.rating - weakest.rating)}<small>vs ${esc(weakest.name)}</small>`, `Gap to weakest ${esc(pos)}`)
      : statHTML(`—<small>no ${esc(pos)} in squad</small>`, `Gap to weakest ${esc(pos)}`);
    const rankStat = listing
      ? statHTML(`#${lad.rank}<small>of ${ladderAll.length} ${esc(pos)}s</small>`, "Position rank")
      : statHTML(`#${lad.rank}<small>among ${lad.listed} squad ${esc(pos)}s</small>`, "Would rank");

    let chips, stats, sidePanel;
    if (inSquad) {
      const lp = listing || p;
      const squadPlayers = c.players.filter(x => (x.squad || "first") === (lp.squad || "first"));
      const nationRank = [...squadPlayers].sort((a, b) => b.rating - a.rating).indexOf(lp) + 1;
      chips = listing
        ? `<span class="chip">#${listing.number}</span><span class="chip">${squadLabel(listing)}</span>`
        : `<span class="chip">not listed at ${esc(pos)}</span>`;
      stats = statHTML(cur.rating.toFixed(2), listing ? "Exact rating" : "Card rating") + rankStat +
        (listing ? statHTML(`#${nationRank}<small>of ${squadPlayers.length} in squad</small>`, "Squad rank") : gapStat) +
        statHTML(`${daysSince(joinedOf(p))}d<small>since ${esc(joinedOf(p))}</small>`, "In squad") +
        statHTML(`${p.callups || 1}<small>${(p.callups || 1) === 1 ? "first stint" : "separate stints"}</small>`, "Call-ups") +
        statHTML(ordinalMedal(lp.tenureRank), "Tenure medal");
      sidePanel = panel("Appearances", `${entry.apps.length} listing${entry.apps.length === 1 ? "" : "s"}`,
        entry.apps.map(a => `<div class="appear"><div>${squadLabel(a)} · ${esc(a.pos)}${a.slot ? ` · ${esc(a.slot)} slot` : ""}</div>
          <span>#${a.number} · this card since ${esc(a.since)}</span></div>`).join(""));
    } else if (status === "dropped") {
      const d = entry.drop;
      chips = `<span class="chip">#${d.number}</span><span class="chip warn">dropped ${esc(d.dropped)}</span>`;
      stats = statHTML(cur.rating.toFixed(2), cur.drop ? "Last rating" : "Card rating") + rankStat + gapStat +
        statHTML(`${daysSince(d.dropped)}d ago<small>${esc(d.dropped)}</small>`, "Dropped") +
        statHTML(`${d.days}d<small>${esc(d.since)} → ${esc(d.dropped)}</small>`, "Last stint") +
        statHTML(`${d.callups}<small>${d.callups === 1 ? "single stint" : "separate stints"}</small>`, "Call-ups");
      sidePanel = panel("Last stint", "", `<div class="appear"><div>${squadLabel(d)} · ${esc(d.pos)}</div><span>#${d.number}</span></div>
        <div class="appear"><div>Called up</div><span>${esc(d.since)}</span></div>
        <div class="appear"><div>Dropped</div><span>${esc(d.dropped)}</span></div>`);
    } else {
      chips = `<span class="chip">not called up</span>`;
      stats = statHTML(cur.rating.toFixed(2), "Card rating") + rankStat + gapStat +
        statHTML(cards.length, "Cards") +
        statHTML(cur.recent ? "yes" : "no", "Recent card");
    }
    const posPanel = panel("Cards", `${cards.length} card${cards.length === 1 ? "" : "s"} · pick one for its ladder and history`,
      cards.map(x => `<button class="appear card-pick${x.pos === pos ? " active" : ""}" data-pos="${esc(x.pos)}">
        <div><span class="ef-pos" data-line="${lineOf(x.pos)}">${esc(x.pos)}</span> ${esc(x.type)}${x.listing ? ` <span class="chip in">in squad</span>` : ""}</div>
        <span class="card-side">${x.recent ? `<span class="chip">recent</span>` : ""}<span class="card-rank" title="${x.listing ? "position rank" : "would rank"}">${rankLabel(x)}</span><span class="card-rating">${x.rating.toFixed(2)}</span></span></button>`).join(""));

    root().innerHTML = `
      <a class="pl-back" href="#${esc(c.id)}">← ${c.flag||""} ${esc(c.name)} squad</a>
      <div class="pl-head ${ctClass(cur.type)}">
        <div class="pl-photo">${photoHTML(p)}</div>
        <div>
          <div class="pl-top">
            <div>
              <h2 class="pl-name">${esc(p.name)}</h2>
              <div class="pl-sub"><a href="#${esc(c.id)}">${c.flag||""} ${esc(c.name)}</a>${tierLabel(c)}</div>
            </div>
            <div class="pl-rating"><span>${listing ? "rating" : cur.drop ? "last rating" : "card rating"}</span><b>${cur.rating.toFixed(0)}</b></div>
          </div>
          <div class="pl-badges">
            <span class="ef-pos" data-line="${lineOf(pos)}">${esc(pos)}</span>
            <span class="chip ct">${esc(cur.type)}</span>
            ${chips}
          </div>
          <div class="pl-stats">${stats}</div>
          <div class="pl-links">
            ${p.tm ? `<a href="${esc(p.tm)}" target="_blank" rel="noopener">transfermarkt ↗</a>` : ""}
            <a href="#${esc(c.id)}">view squad</a>
          </div>
        </div>
      </div>
      <div class="pl-grid">
        ${panel(`${esc(pos)} ladder`, listing ? `all ${ladderAll.length} squad ${esc(pos)}s by rating`
                                             : `where this card would sit among ${lad.listed} squad ${esc(pos)}s`, ladderTabs + ladderRows)}
        <div class="pl-stack">${sidePanel || ""}${posPanel}</div>
      </div>
      <div id="pl-history" class="pl-history" data-key="${esc(entry.key)}">${panel("Card history", "loading…", "")}</div>
      ${nationAtPos.length ? gridSectionPlayers(`${listing ? "Other" : "Current"} ${esc(pos)}s in ${esc(c.name)}`, nationAtPos, c) : ""}
      ${poolAtPos.length ? gridSectionPlayers(`${esc(pos)} cards in the ${esc(c.name)} pool, not in a squad at ${esc(pos)}`, poolAtPos, c) : ""}`;
    root().querySelectorAll(".card-pick, .ladder-tab").forEach(el =>
      el.addEventListener("click", () => goCard(entry, el.dataset.pos)));
    fillHistory(entry, pos);
  }

  function gridSectionPlayers(title, players, c) {
    return `<div class="ef-section">
      <div class="ef-section-title">${title}<span class="count">${players.length}</span></div>
      <div class="ef-grid">${players.map(x => card(x, c)).join("")}</div></div>`;
  }

  const VIEWS = {
    overview: ["Overview", "Where all 100 squads stand today."],
    nations: ["Nations", "Search or pick a nation to see its first and/or second squads."],
    records: ["Records", "Player records by position, jersey number, and squad tenure."],
    player: ["Player", ""],
  };

  const bust = "?v=" + Date.now();
  Promise.all([
    fetch(DATA_URL + bust).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch(POOL_URL + bust).then(r => r.ok ? r.json() : null).catch(() => null),
  ])
    .then(([data, poolData]) => {
      const countries = data.countries || [];
      const playerCount = new Set(countries.flatMap(c => c.players.map(p => playerKey(c, p)))).size;
      const stat = statHTML;
      document.getElementById("ef-meta").innerHTML =
        stat(countries.length, "Nations") +
        stat(playerCount.toLocaleString(), "Squad players") +
        stat(esc((data.updated || "—").split(" ")[0]) +
             `<small>${esc((data.updated || "").split(" ").slice(1).join(" "))}</small>`, "Last updated") +
        stat(`<a href="${esc(data.source)}" target="_blank" rel="noopener">github ↗</a>`, "Source");
      if (!countries.length) {
        root().innerHTML = `<div class="ef-error">No squads available.</div>`;
        return;
      }

      const index = buildIndex(countries, poolData && poolData.countries);
      bindPlayerSearch(index, countries);

      const known = GROUPS.map(([g]) => g);
      const groups = GROUPS
        .map(([g, label]) => [label, countries.filter(c => (c.group || "contender") === g)])
        .concat([["Other", countries.filter(c => c.group && !known.includes(c.group))]])
        .filter(([, list]) => list.length);
      const ordered = groups.flatMap(([, list]) => list);
      const tabs = document.getElementById("ef-tabs");
      const list = document.getElementById("nation-list");
      const scores = new Map(strength(countries).map(r => [r.c.id, r.avg]));
      list.innerHTML = groups.map(([label, items]) => `<div class="nation-group">
          <div class="nation-group-label"><span>${label}</span>${items.length}</div>${items.map(c => {
            const sc = scores.get(c.id) || 0;
            return `<a class="nation-row" href="#${esc(c.id)}" data-id="${esc(c.id)}" data-name="${esc(c.name.toLowerCase())}"
                 title="${esc(c.name)} · starters avg ${sc ? sc.toFixed(1) : "0"}">
               <span class="flag">${c.flag||''}</span><span class="nm">${esc(c.name)}</span>
               <span class="score">${sc ? sc.toFixed(1) : "0"}</span></a>`;
          }).join("")}</div>`).join("") +
        `<div class="no-match" hidden>no nation matches.</div>`;

      const filter = document.getElementById("nation-filter");
      filter.addEventListener("input", () => {
        const q = filter.value.trim().toLowerCase();
        let any = false;
        list.querySelectorAll(".nation-group").forEach(g => {
          let shown = 0;
          g.querySelectorAll(".nation-row").forEach(t => {
            const hit = !q || t.dataset.name.includes(q) || t.dataset.id.includes(q);
            t.hidden = !hit; shown += hit;
          });
          g.hidden = !shown; any = any || shown > 0;
        });
        list.querySelector(".no-match").hidden = any;
      });
      filter.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        const first = list.querySelector(".nation-row:not([hidden])");
        if (first) location.hash = first.dataset.id;
      });

      let lastNation = ordered[0], lastPlayer = null;
      const nav = document.getElementById("site-nav");
      const hero = document.getElementById("hero");
      const route = () => {
        const hash = decodeURIComponent(location.hash.slice(1));
        const nation = countries.find(c => c.id === hash);
        const key = hash.replace(/^\//, "");
        const [pid, pslug, cardPos] = key.startsWith("player/") ? key.slice(7).split("/") : [];
        const player = pid ? index.get(`${pid}/${pslug}`) : null;
        const view = nation ? "nations" : player ? "player" : (VIEWS[key] ? key : "overview");
        nav.querySelectorAll("a[data-view]").forEach(a =>
          a.classList.toggle("active", a.dataset.view === view));
        document.querySelector(".view-head").hidden = view === "player" || view === "overview";
        document.getElementById("view-title").textContent = VIEWS[view][0];
        document.getElementById("view-desc").textContent = VIEWS[view][1];
        document.title = (player ? `${player.p.name} · ` : "") + "The Call-Up · Wesley Zheng";
        hero.hidden = view !== "overview";
        tabs.hidden = view !== "nations";
        document.getElementById("layout").classList.toggle("with-sidebar", view === "nations");
        if (view === "nations") {
          if (nation) lastNation = nation;
          list.querySelectorAll(".nation-row").forEach(t =>
            t.classList.toggle("active", t.dataset.id === lastNation.id));
          const active = list.querySelector(".nation-row.active");
          if (active) {
            const top = active.offsetTop - list.offsetTop, h = list.clientHeight;
            if (top < list.scrollTop + 30 || top > list.scrollTop + h - 40) list.scrollTop = top - h / 3;
          }
          renderSquad(lastNation);
        } else if (view === "player") renderPlayer(player, index, cardPos);
        else if (view === "records") renderRecords(countries);
        else renderOverview(countries);
        const samePlayer = player && player === lastPlayer;
        lastPlayer = player;
        if ((nation || key) && !samePlayer) window.scrollTo({ top: 0 });
      };
      window.addEventListener("hashchange", route);
      route();
    })
    .catch(err => {
      root().innerHTML = `<div class="ef-error">Couldn't load squads (${esc(err.message)}).</div>`;
    });
})();
</script>
</body>
</html>
